name: Desktop release

# Builds the desktop installers for Windows, macOS and Linux on their own runners
# (macOS installers can only be built on a Mac) and uploads them as workflow
# artifacts. Run it by hand, or push a `desktop-v*` tag.
#
# Repository variables (Settings → Secrets and variables → Actions → Variables):
#   DESKTOP_API_URL     https://api.example.com/api/v1   (baked into web + main process)
#   DESKTOP_WEB_URL     https://app.example.com
#   DESKTOP_UPDATE_URL  https://downloads.example.com/desktop   (optional; enables in-app updates)
#
# Optional signing secrets — without them the builds are unsigned:
#   Windows: WIN_CSC_LINK (base64 .pfx), WIN_CSC_KEY_PASSWORD
#   macOS:   MAC_CSC_LINK (base64 .p12), MAC_CSC_KEY_PASSWORD,
#            APPLE_API_KEY_BASE64 (.p8), APPLE_API_KEY_ID, APPLE_API_ISSUER (notarisation)

on:
  workflow_dispatch:
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            platform: win
          - name: macOS
            os: macos-latest
            platform: mac
          - name: Linux
            os: ubuntu-latest
            platform: linux
    env:
      VITE_API_URL: ${{ vars.DESKTOP_API_URL }}
      ONETAB_API_URL: ${{ vars.DESKTOP_API_URL }}
      ONETAB_WEB_URL: ${{ vars.DESKTOP_WEB_URL }}
      ONETAB_UPDATE_URL: ${{ vars.DESKTOP_UPDATE_URL }}
      NX_NO_CLOUD: 'true'
      # Tag builds are releases: write-config.mjs then refuses non-https endpoints.
      ONETAB_RELEASE: ${{ startsWith(github.ref, 'refs/tags/') && '1' || '' }}
      HAS_WIN_CERT: ${{ secrets.WIN_CSC_LINK != '' }}
      HAS_MAC_CERT: ${{ secrets.MAC_CSC_LINK != '' }}
      # Large monorepo build; the default heap is not always enough on the hosted runners.
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Windows signing
        if: matrix.platform == 'win' && env.HAS_WIN_CERT == 'true'
        shell: bash
        run: |
          echo "CSC_LINK=${{ secrets.WIN_CSC_LINK }}" >> "$GITHUB_ENV"
          echo "CSC_KEY_PASSWORD=${{ secrets.WIN_CSC_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: macOS signing and notarisation
        if: matrix.platform == 'mac' && env.HAS_MAC_CERT == 'true'
        shell: bash
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          echo "CSC_LINK=${{ secrets.MAC_CSC_LINK }}" >> "$GITHUB_ENV"
          echo "CSC_KEY_PASSWORD=${{ secrets.MAC_CSC_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          if [ -n "$APPLE_API_KEY_BASE64" ]; then
            key="$RUNNER_TEMP/apple-api-key.p8"
            echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$key"
            echo "APPLE_API_KEY=$key" >> "$GITHUB_ENV"
            echo "APPLE_API_KEY_ID=${{ secrets.APPLE_API_KEY_ID }}" >> "$GITHUB_ENV"
            echo "APPLE_API_ISSUER=${{ secrets.APPLE_API_ISSUER }}" >> "$GITHUB_ENV"
          fi

      - name: Package
        run: npx nx run @org/desktop:package -- --${{ matrix.platform }}

      - uses: actions/upload-artifact@v4
        with:
          name: onetab-ai-desktop-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.tar.gz
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest*.yml
