events {
  worker_connections 4096;
  multi_accept on;
  use epoll;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  log_format main_json escape=json '{'
    '"time_local":"$time_local",'
    '"remote_addr":"$remote_addr",'
    '"request_method":"$request_method",'
    '"request_uri":"$request_uri",'
    '"status":$status,'
    '"body_bytes_sent":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"upstream_response_time":"$upstream_response_time",'
    '"upstream_addr":"$upstream_addr",'
    '"upstream_status":"$upstream_status",'
    '"http_referrer":"$http_referer",'
    '"http_user_agent":"$http_user_agent"'
  '}';

  access_log /var/log/nginx/access.log main_json;
  error_log  /var/log/nginx/error.log warn;

  sendfile        on;
  tcp_nopush      on;
  tcp_nodelay     on;
  keepalive_timeout  65;
  types_hash_max_size 2048;

  client_max_body_size 50M;
  client_body_buffer_size 128k;

  # Gzip compression
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

  # Upstream Clustered Backend API Instances
  upstream onetab_api_cluster {
    least_conn; # Routes new requests to the instance with the fewest active connections

    server api-1:3000 max_fails=3 fail_timeout=10s;
    server api-2:3000 max_fails=3 fail_timeout=10s;
    server api-3:3000 max_fails=3 fail_timeout=10s backup;

    keepalive 64; # Maintain persistent connection pool to upstream instances
  }

  server {
    listen 80;
    server_name localhost _;

    # Root redirect or frontend proxy
    location / {
      proxy_pass http://onetab_api_cluster;
      proxy_http_version 1.1;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";

      proxy_connect_timeout 5s;
      proxy_read_timeout 60s;
      proxy_send_timeout 60s;
    }

    # API Routes with cluster load balancing
    location /api/ {
      proxy_pass http://onetab_api_cluster;
      proxy_http_version 1.1;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";

      proxy_connect_timeout 5s;
      proxy_read_timeout 60s;
      proxy_send_timeout 60s;
    }

    # Realtime SSE Stream - disable buffering & allow long-lived stream
    location /api/v1/realtime/stream {
      proxy_pass http://onetab_api_cluster;
      proxy_http_version 1.1;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      
      # SSE Specific tuning
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_cache off;
      chunked_transfer_encoding on;

      proxy_read_timeout 3600s; # 1 hour stream timeout
      proxy_send_timeout 3600s;
    }

    # Active Load Balancer Health Probe
    location /lb-health {
      access_log off;
      return 200 '{"load_balancer":"healthy","status":"ok"}\n';
      add_header Content-Type application/json;
    }

    # API Liveness Proxy
    location /health {
      proxy_pass http://onetab_api_cluster/api/v1/health;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      access_log off;
    }

    # API Readiness Proxy
    location /ready {
      proxy_pass http://onetab_api_cluster/api/v1/ready;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
    }
  }
}
