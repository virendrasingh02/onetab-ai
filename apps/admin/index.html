<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Admin</title>
    <base href="/" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Matches the palette's `--background` in each theme. -->
    <meta
      name="theme-color"
      content="#FBFBFC"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#010102"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:ital,wght@0,100..900;1,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles.css" />

    <!--
      Applies the stored theme before first paint; without it the admin app
      always painted its first frame light and then jumped for anyone who had
      chosen dark. Light is the default, so the OS preference is consulted only
      when the user explicitly picked `system`.

      Must stay behaviourally identical to `themeInitScript` in
      libs/shared/design-system/src/lib/theme-provider.tsx.
    -->
    <script>
      (function () {
        try {
          var k = localStorage.getItem('onetab.theme');
          var d =
            k === 'dark' ||
            (k === 'system' &&
              matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', d);
          document.documentElement.style.colorScheme = d ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
