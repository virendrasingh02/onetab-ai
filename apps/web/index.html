<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>OneTab AI</title>
    <base href="/" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="OneTab AI — workspaces, channels and files for focused team collaboration."
    />
    <!-- Matches the palette's `--background` in each theme. -->
    <meta
      name="theme-color"
      content="#FBFBFC"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#010102"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
      rel="stylesheet"
    />

    <!--
      Applies the stored theme before first paint. React mounts too late to
      prevent a flash when reloading into the dark theme.

      Light is the default, so the OS preference is only consulted when the user
      has explicitly chosen `system`. An unset key means "never chose" — reading
      it as `system` put dark-desktop users into dark for one frame, then
      <ThemeProvider defaultTheme="light"> immediately flipped them back.

      Must stay behaviourally identical to `themeInitScript` in
      libs/shared/design-system/src/lib/theme-provider.tsx.
    -->
    <script>
      (function () {
        try {
          var el = document.documentElement;
          var k = localStorage.getItem('onetab.theme');
          var d =
            k === 'dark' ||
            (k === 'system' &&
              matchMedia('(prefers-color-scheme: dark)').matches);
          el.classList.toggle('dark', d);
          el.style.colorScheme = d ? 'dark' : 'light';
          el.setAttribute(
            'data-density',
            localStorage.getItem('onetab.density') || 'default',
          );
          el.setAttribute(
            'data-accent',
            localStorage.getItem('onetab.accent') || 'mint',
          );
          el.setAttribute(
            'data-radius',
            localStorage.getItem('onetab.radius') || 'md',
          );
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
