<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>OneTab AI</title>
    <base href="/" />

    <!--
      `viewport-fit=cover` lets the page paint under the notch / home indicator
      and makes `env(safe-area-inset-*)` non-zero so the `*-safe` utilities and
      `--safe-*` tokens in the design system actually clear those regions.
      `interactive-widget=resizes-content` asks the engine to shrink the layout
      viewport when the virtual keyboard opens rather than pan over the page.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta
      name="description"
      content="OneTab AI — workspaces, channels and files for focused team collaboration."
    />
    <!-- Matches the palette's `--background` in each theme. -->
    <meta
      name="theme-color"
      content="#FBFBFC"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#010102"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
      rel="stylesheet"
    />

    <!--
      Applies the stored theme before first paint. React mounts too late to
      prevent a flash when reloading into the dark theme.

      Appearance is stored per workspace: the keys are suffixed with the id of
      the workspace the user last had open (`onetab_active_workspace_id`), so a
      reload lands on that workspace's theme and one workspace's look never
      bleeds into another. The unscoped keys are the fallback (no workspace open
      yet, or a workspace never themed on this device).

      Light is the default, so the OS preference is only consulted when the user
      has explicitly chosen `system`. An unset key means "never chose" — reading
      it as `system` put dark-desktop users into dark for one frame, then
      <ThemeProvider defaultTheme="light"> immediately flipped them back.

      Must stay behaviourally identical to `themeInitScript` in
      libs/shared/design-system/src/lib/theme-provider.tsx.
    -->
    <script>
      (function () {
        try {
          var el = document.documentElement;
          var ws = null;
          try {
            ws = localStorage.getItem('onetab_active_workspace_id');
          } catch (e) {}
          function g(base) {
            var v = null;
            if (ws) {
              try {
                v = localStorage.getItem(base + '::' + ws);
              } catch (e) {}
            }
            if (v == null) {
              try {
                v = localStorage.getItem(base);
              } catch (e) {}
            }
            return v;
          }
          var k = g('onetab.theme');
          var d =
            k === 'dark' ||
            (k === 'system' &&
              matchMedia('(prefers-color-scheme: dark)').matches);
          el.classList.toggle('dark', d);
          el.style.colorScheme = d ? 'dark' : 'light';
          el.setAttribute('data-density', g('onetab.density') || 'default');
          el.setAttribute('data-accent', g('onetab.accent') || 'mint');
          el.setAttribute('data-radius', g('onetab.radius') || 'md');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
